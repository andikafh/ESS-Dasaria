<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ESS — Ajukan Izin</title>
  <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
<div class="phone">
  <div class="status-bar"><span class="s-time">09:41</span><div class="s-icons"><span style="font-size:13px">🔋</span></div></div>
  <div class="app">
    <div class="page" style="padding-bottom:0">

      <div class="screen-header" style="position:sticky;top:0;z-index:40">
        <a href="izin-cuti.html" class="btn-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg></a>
        <h1>Ajukan Izin / Cuti</h1>
      </div>

      <div class="form-section">

        <div class="form-group">
          <label class="form-label">Jenis Izin / Cuti</label>
          <select class="form-control">
            <option>-- Pilih Jenis --</option>
            <option>Izin Sakit</option>
            <option>Izin Pribadi Mendesak</option>
            <option>Dinas Luar</option>
            <option>Cuti Tahunan</option>
            <option>Cuti Melahirkan</option>
            <option>Cuti Menikah</option>
            <option>Cuti Khusus</option>
          </select>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" class="form-group">
          <div>
            <label class="form-label">Tanggal Mulai</label>
            <input type="date" class="form-control" value="2026-06-25">
          </div>
          <div>
            <label class="form-label">Tanggal Selesai</label>
            <input type="date" class="form-control" value="2026-06-25">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Alasan Pengajuan</label>
          <textarea class="form-control" rows="3" placeholder="Jelaskan alasan pengajuan Anda..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Lampiran (opsional)</label>
          <div class="upload-zone">
            <span class="uz-icon">📎</span>
            <div class="uz-text">Tap untuk upload dokumen</div>
            <div class="uz-hint">PDF, JPG, PNG · Maks 5MB</div>
          </div>
        </div>

        <!-- Durasi preview -->
        <div style="background:var(--gray-50);border-radius:var(--r-sm);padding:14px;display:flex;align-items:center;gap:12px" class="form-group">
          <div style="font-size:28px">📅</div>
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--gray-900)">1 Hari Kerja</div>
            <div style="font-size:12px;color:var(--gray-400)">Kamis, 25 Juni 2026</div>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div style="font-size:11px;color:var(--gray-400)">Saldo sesudah</div>
            <div style="font-size:16px;font-weight:800;color:var(--success-dark)">11 Hari</div>
          </div>
        </div>

        <div class="alert alert-primary form-group">
          <div class="alert-icon">ℹ️</div>
          <div class="alert-body">
            <div class="alert-title">Alur Persetujuan</div>
            <div class="alert-text">Pengajuan akan diteruskan ke <strong>Atasan Langsung</strong> → <strong>HC Comben</strong>. Estimasi approval <strong>kurang dari 24 jam</strong>.</div>
          </div>
        </div>

        <a href="status-approved.html" class="btn btn-primary btn-full" style="margin-bottom:10px">Kirim Pengajuan</a>
        <a href="izin-cuti.html" class="btn btn-ghost btn-full">Batal</a>

        <div style="height:20px"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
